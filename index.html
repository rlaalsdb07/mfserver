<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배틀로열 RPG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-red {
            0%, 100% { background-color: rgba(153, 27, 27, 0.4); }
            50% { background-color: rgba(153, 27, 27, 0.8); }
        }
        .pulse-danger { animation: pulse-red 2s infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- 상단 헤더 & 상태바 -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <h1 class="text-xl font-extrabold text-amber-500 flex items-center gap-2">
                <i class="fa-solid fa-skull"></i> BATTLE ROYALE RPG
            </h1>
            <div id="game-status-bar" class="hidden flex items-center gap-4 text-xs">
                <span class="bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
                    방 코드: <strong id="display-room-code" class="text-amber-400">-----</strong>
                </span>
                <span class="bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
                    라운드: <strong id="stat-turn" class="text-cyan-400">1</strong>
                </span>
                <span class="bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
                    생존자: <strong id="stat-survivors" class="text-emerald-400">0</strong>명
                </span>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-4xl mx-auto w-full p-4 flex-grow">

        <!-- 대기실 화면 -->
        <div id="screen-room-waiting" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl mb-6">
            <h2 class="text-lg font-bold mb-4 text-slate-200 border-b border-slate-800 pb-2">대기실 참가자 목록</h2>
            <div id="waiting-player-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6"></div>
            
            <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                <p id="waiting-status-msg" class="text-xs text-amber-400 animate-pulse">방장이 게임을 시작하기를 기다리는 중...</p>
                <button id="btn-host-start" onclick="hostStartGame()" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-6 py-2.5 rounded-xl text-sm transition">
                    게임 시작
                </button>
                <button onclick="leaveRoom()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs transition">
                    나가기
                </button>
            </div>
        </div>

        <!-- 게임플레이 메인 화면 -->
        <div id="screen-gameplay" class="hidden space-y-6">
            <!-- 내 상태 및 조작 패널 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4 pb-4 border-b border-slate-800">
                    <div>
                        <div class="flex items-center gap-2 mb-1">
                            <span id="player-display-name" class="font-bold text-lg text-slate-100">플레이어</span>
                            <span id="player-status-badge" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full font-bold">생존</span>
                        </div>
                        <p class="text-xs text-slate-400">현재 위치: <span id="player-location-name" class="text-cyan-400 font-semibold">알 수 없음</span></p>
                    </div>

                    <!-- HP 체력바 -->
                    <div class="w-full sm:w-48">
                        <div class="flex justify-between text-xs mb-1 font-semibold">
                            <span class="text-slate-400">HP</span>
                            <span id="hp-text" class="text-slate-200">100 / 100</span>
                        </div>
                        <div class="w-full bg-slate-950 rounded-full h-2.5 border border-slate-800 overflow-hidden">
                            <div id="hp-bar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>

                <!-- 능력치 & 장비 요약 -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs mb-4">
                    <div class="bg-slate-950 p-2 rounded-lg border border-slate-800/80">
                        <span class="text-slate-500 block">무기</span>
                        <span id="equip-weapon" class="font-bold text-amber-400 truncate block">맨손</span>
                    </div>
                    <div class="bg-slate-950 p-2 rounded-lg border border-slate-800/80">
                        <span class="text-slate-500 block">방어구</span>
                        <span id="equip-armor" class="font-bold text-cyan-400 truncate block">일반 의류</span>
                    </div>
                    <div class="bg-slate-950 p-2 rounded-lg border border-slate-800/80">
                        <span class="text-slate-500 block">능력치 (STR/DEX)</span>
                        <span class="font-bold text-slate-300"><span id="p-str">10</span> / <span id="p-dex">10</span></span>
                    </div>
                    <div class="bg-slate-950 p-2 rounded-lg border border-slate-800/80">
                        <span class="text-slate-500 block">능력치 (INT/LUCK)</span>
                        <span class="font-bold text-slate-300"><span id="p-int">10</span> / <span id="p-luck">10</span></span>
                    </div>
                </div>

                <!-- 행동 선택 패널 -->
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-bold text-slate-300">라운드 행동 선택</span>
                        <span id="action-lock-status" class="text-[10px] text-amber-400 font-semibold">행동 선택 대기중</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="selectTurnAction('scavenge')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1.5 transition">
                            <i class="fa-solid fa-magnifying-glass text-cyan-400 text-base"></i> 탐색하기
                        </button>
                        <button onclick="selectTurnAction('rest')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1.5 transition">
                            <i class="fa-solid fa-bed text-emerald-400 text-base"></i> 휴식하기
                        </button>
                        <button onclick="selectTurnAction('attack')" class="bg-slate-800 hover:bg-slate-700 active:bg-slate-900 border border-slate-700 p-3 rounded-xl text-xs font-bold flex flex-col items-center gap-1.5 transition">
                            <i class="fa-solid fa-swords text-red-400 text-base"></i> 교전하기
                        </button>
                    </div>
                </div>

                <!-- 서브 메뉴 버튼 -->
                <div class="flex gap-2 mt-4">
                    <button onclick="openInventoryModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold py-2.5 rounded-xl border border-slate-700 transition">
                        <i class="fa-solid fa-box-open mr-1 text-amber-400"></i> 인벤토리
                    </button>
                    <button onclick="openCraftingModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold py-2.5 rounded-xl border border-slate-700 transition">
                        <i class="fa-solid fa-hammer mr-1 text-cyan-400"></i> 아이템 제작
                    </button>
                </div>
            </div>

            <!-- 지도 현황 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-map"></i> 구역 지도
                </h3>
                <div id="map-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
            </div>

            <!-- 로그 기록 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-scroll"></i> 전투 상황 기록
                </h3>
                <div id="event-log-container" class="bg-slate-950 border border-slate-800/80 rounded-xl p-3 h-48 overflow-y-auto font-mono text-xs text-slate-400 leading-relaxed space-y-1"></div>
            </div>
        </div>
    </main>

    <!-- 인벤토리 모달 -->
    <div id="modal-inventory" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 class="font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-box-open text-amber-400"></i> 인벤토리
                </h3>
                <button onclick="closeModal('modal-inventory')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 mb-2">장착 중인 장비</h4>
                    <div id="inventory-equipped-list" class="space-y-1.5"></div>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-slate-400 mb-2">소지 아이템</h4>
                    <div id="inventory-items-list" class="space-y-1.5 max-h-48 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 제작 모달 -->
    <div id="modal-crafting" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                <h3 class="font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-hammer text-cyan-400"></i> 아이템 제작
                </h3>
                <button onclick="closeModal('modal-crafting')" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <h4 class="text-xs font-bold text-slate-400 mb-1.5">보유 재료</h4>
                    <div id="crafting-materials-summary" class="flex flex-wrap gap-1.5 text-xs"></div>
                </div>
                <div>
                    <h4 class="text-xs font-bold text-slate-400 mb-2">제작 가능 레시피</h4>
                    <div id="crafting-recipes-list" class="space-y-2 max-h-56 overflow-y-auto pr-1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase 및 메인 게임 로직 Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase 설정 (실제 환경 데이터 입력 필요)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 정적 게임 데이터베이스 정의
        const ZONES = [
            { id: 0, name: "중앙 광장", desc: "물자가 다수 존재하지만 위험한 지역입니다.", icon: "fa-monument", specialItem: "구급상자" },
            { id: 1, name: "폐허가 된 연구소", desc: "고성능 부품과 무기를 얻을 수 있습니다.", icon: "fa-flask", specialItem: "고성능 파츠" },
            { id: 2, name: "버려진 주택가", desc: "기본적인 생존 물자를 수집하기 좋습니다.", icon: "fa-house", specialItem: "붕대" },
            { id: 3, name: "군사 기지", desc: "강력한 군용 무기가 숨겨져 있습니다.", icon: "fa-shield-halved", specialItem: "군용 칼" },
            { id: 4, name: "음침한 숲", desc: "몸을 숨기기 쉽고 자연 재료가 풍부합니다.", icon: "fa-tree", specialItem: "단단한 목재" },
            { id: 5, name: "항구 창고", desc: "철재와 금속 부품을 찾을 수 있습니다.", icon: "fa-warehouse", specialItem: "고철 조각" }
        ];

        const ITEMS_DATABASE = {
            "구급상자": { type: "consumable", effect: "heal", value: 50, desc: "HP를 50 회복합니다." },
            "붕대": { type: "consumable", effect: "heal", value: 20, desc: "HP를 20 회복합니다." },
            "군용 칼": { type: "weapon", atk: 15, desc: "공격력을 상승시킵니다. (+15)" },
            "고성능 파츠": { type: "material", desc: "제작 재료" },
            "단단한 목재": { type: "material", desc: "제작 재료" },
            "고철 조각": { type: "material", desc: "제작 재료" }
        };

        const RECIPES = [
            { name: "개량형 단검", result: "군용 칼", req: { "고철 조각": 2, "단단한 목재": 1 }, desc: "공격력 +15 무기" },
            { name: "응급 키트", result: "구급상자", req: { "붕대": 2 }, desc: "HP 50 회복 아이템" }
        ];

        // 전역 플레이어 세션 상태
        let roomCode = "ROOM123"; 
        let localPlayerId = "player_" + Math.random().toString(36).substring(2, 9);
        let isHost = false;

        let player = {
            id: localPlayerId,
            name: "플레이어_" + localPlayerId.substring(7),
            hp: 100,
            maxHp: 100,
            location: 0,
            isAlive: true,
            equippedWeapon: "맨손",
            equippedArmor: "일반 의류",
            inventory: { materials: {}, items: {} },
            selectedAction: null
        };

        let stats = { str: 10, dex: 10, int: 10, luck: 10 };

        const getRoomRef = () => ref(db, `rooms/${roomCode}`);

        // 초기화 함수
        async function initGame() {
            const joined = await joinRoomInFirestore();
            if (!joined) {
                await createRoomInFirestore();
                isHost = true;
            }
            listenToRoomUpdates();
        }

        async function createRoomInFirestore() {
            const roomRef = getRoomRef();
            const initialRoomData = {
                roomCode: roomCode,
                status: "waiting",
                turn: 1,
                restrictedZones: [],
                logs: [`방 [${roomCode}]이(가) 개설되었습니다.`],
                players: {
                    [localPlayerId]: {
                        ...player,
                        stats: stats,
                        isHost: true
                    }
                }
            };
            await set(roomRef, initialRoomData);
        }

        async function joinRoomInFirestore() {
            const roomRef = getRoomRef();
            const snapshot = await get(roomRef);

            if (!snapshot.exists()) return false;

            const roomData = snapshot.val();
            if (roomData.status !== "waiting") {
                alert("이미 진행 중이거나 종료된 방입니다.");
                return false;
            }

            const playerRef = ref(db, `rooms/${roomCode}/players/${localPlayerId}`);
            await set(playerRef, {
                ...player,
                stats: stats,
                isHost: false
            });

            return true;
        }

        function listenToRoomUpdates() {
            const roomRef = getRoomRef();
            onValue(roomRef, (snapshot) => {
                if (!snapshot.exists()) return;

                const roomData = snapshot.val();
                renderWaitingRoom(roomData);
                renderGameplayUI(roomData);

                if (roomData.status === "playing") {
                    document.getElementById("screen-room-waiting").classList.add("hidden");
                    document.getElementById("screen-gameplay").classList.remove("hidden");
                    document.getElementById("game-status-bar").classList.remove("hidden");
                }
            });
        }

        function renderWaitingRoom(roomData) {
            const playerListEl = document.getElementById("waiting-player-list");
            playerListEl.innerHTML = "";

            const players = roomData.players || {};
            Object.values(players).forEach((p) => {
                const card = document.createElement("div");
                card.className = "bg-slate-950 border border-slate-800 p-3 rounded-xl flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-user text-slate-400"></i>
                        <span class="font-bold text-sm text-slate-200">${p.name}</span>
                        ${p.isHost ? '<span class="text-[10px] bg-red-950 text-red-400 border border-red-800 px-1.5 py-0.5 rounded font-bold">방장</span>' : ''}
                    </div>
                    <span class="text-xs text-slate-400">HP ${p.hp}/${p.maxHp}</span>
                `;
                playerListEl.appendChild(card);
            });

            const hostStartBtn = document.getElementById("btn-host-start");
            const waitingMsg = document.getElementById("waiting-status-msg");

            if (isHost) {
                hostStartBtn.classList.remove("hidden");
                waitingMsg.classList.add("hidden");
            } else {
                hostStartBtn.classList.add("hidden");
                waitingMsg.classList.remove("hidden");
            }
        }

        window.hostStartGame = async function() {
            if (!isHost) return;
            const roomRef = getRoomRef();
            await update(roomRef, { status: "playing" });
        };

        window.leaveRoom = function() {
            location.reload();
        };

        function renderGameplayUI(roomData) {
            const players = roomData.players || {};
            const me = players[localPlayerId];

            if (me) {
                player = me;
                document.getElementById("player-display-name").textContent = me.name;
                document.getElementById("player-location-name").textContent = ZONES[me.location]?.name || "알 수 없음";
                document.getElementById("hp-text").textContent = `${me.hp} / ${me.maxHp}`;
                
                const hpPercent = Math.max(0, Math.min(100, (me.hp / me.maxHp) * 100));
                document.getElementById("hp-bar").style.width = `${hpPercent}%`;

                document.getElementById("equip-weapon").textContent = me.equippedWeapon || "맨손";
                document.getElementById("equip-armor").textContent = me.equippedArmor || "일반 의류";

                if (me.stats) {
                    document.getElementById("p-str").textContent = me.stats.str;
                    document.getElementById("p-dex").textContent = me.stats.dex;
                    document.getElementById("p-int").textContent = me.stats.int;
                    document.getElementById("p-luck").textContent = me.stats.luck;
                }

                const statusBadge = document.getElementById("player-status-badge");
                if (me.isAlive) {
                    statusBadge.textContent = "생존";
                    statusBadge.className = "text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full font-bold";
                } else {
                    statusBadge.textContent = "사망";
                    statusBadge.className = "text-[10px] bg-red-950 text-red-500 border border-red-800 px-2.5 py-0.5 rounded-full font-bold animate-pulse";
                }

                const lockStatus = document.getElementById("action-lock-status");
                if (me.selectedAction) {
                    lockStatus.textContent = `선택 완료 (${me.selectedAction})`;
                    lockStatus.className = "text-[10px] text-emerald-400 font-semibold";
                } else {
                    lockStatus.textContent = "행동 선택 대기중";
                    lockStatus.className = "text-[10px] text-amber-400 font-semibold";
                }
            }

            document.getElementById("display-room-code").textContent = roomCode;
            document.getElementById("stat-turn").textContent = roomData.turn || 1;

            const aliveCount = Object.values(players).filter(p => p.isAlive).length;
            document.getElementById("stat-survivors").textContent = aliveCount;

            renderMap(roomData);
            renderLogs(roomData.logs || []);
        }

        function renderMap(roomData) {
            const gridEl = document.getElementById("map-grid");
            gridEl.innerHTML = "";

            const restricted = roomData.restrictedZones || [];
            const players = roomData.players || {};

            ZONES.forEach((zone) => {
                const isRestricted = restricted.includes(zone.id);
                const playersInZone = Object.values(players).filter(p => p.isAlive && p.location === zone.id);
                const isMyZone = player.location === zone.id;

                const zoneCard = document.createElement("div");
                zoneCard.className = `p-3 rounded-xl border flex flex-col justify-between transition cursor-pointer relative overflow-hidden ${
                    isRestricted 
                        ? 'bg-red-950/40 border-red-800/80 pulse-danger' 
                        : isMyZone 
                            ? 'bg-slate-800 border-cyan-500 shadow-md shadow-cyan-950/50' 
                            : 'bg-slate-900 border-slate-800 hover:border-slate-700'
                }`;

                zoneCard.onclick = () => moveZone(zone.id);

                let badgeMarkup = isRestricted 
                    ? `<span class="text-[9px] bg-red-950 text-red-400 border border-red-800 px-1.5 py-0.5 rounded font-bold uppercase">금지 구역</span>`
                    : `<span class="text-[9px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-1.5 py-0.5 rounded font-bold uppercase">안전</span>`;

                let playerIcons = playersInZone.map(p => 
                    `<span class="inline-block bg-slate-800 border border-slate-600 rounded px-1 text-[10px] text-amber-300 font-bold">${p.name}</span>`
                ).join(" ");

                zoneCard.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-xs text-slate-100 flex items-center gap-1.5">
                                <i class="fa-solid ${zone.icon} text-slate-400"></i> ${zone.name}
                            </span>
                            ${badgeMarkup}
                        </div>
                        <p class="text-[10px] text-slate-400 line-clamp-1">${zone.desc}</p>
                    </div>
                    <div class="mt-2 pt-1.5 border-t border-slate-800/60 flex items-center justify-between text-[10px]">
                        <span class="text-slate-500">생존자 (${playersInZone.length})</span>
                        <div class="flex gap-1 overflow-hidden">${playerIcons}</div>
                    </div>
                `;

                gridEl.appendChild(zoneCard);
            });
        }

        async function moveZone(zoneId) {
            if (!player.isAlive) return;
            const playerRef = ref(db, `rooms/${roomCode}/players/${localPlayerId}`);
            await update(playerRef, { location: zoneId });
        }

        window.selectTurnAction = async function(actionType) {
            if (!player.isAlive) {
                alert("사망한 상태에서는 행동할 수 없습니다.");
                return;
            }

            const playerRef = ref(db, `rooms/${roomCode}/players/${localPlayerId}`);
            await update(playerRef, { selectedAction: actionType });

            checkAndResolveTurn();
        };

        async function checkAndResolveTurn() {
            if (!isHost) return;

            const roomRef = getRoomRef();
            const snapshot = await get(roomRef);
            if (!snapshot.exists()) return;

            const roomData = snapshot.val();
            const players = roomData.players || {};
            const alivePlayers = Object.values(players).filter(p => p.isAlive);

            const allReady = alivePlayers.every(p => p.selectedAction !== null && p.selectedAction !== undefined);

            if (allReady && alivePlayers.length > 0) {
                resolveTurnLogic(roomData);
            }
        }

        async function resolveTurnLogic(roomData) {
            let players = roomData.players;
            let logs = roomData.logs || [];
            let currentTurn = roomData.turn || 1;
            let restrictedZones = roomData.restrictedZones || [];

            logs.push(`\n=== [라운드 ${currentTurn} 결과] ===`);

            Object.keys(players).forEach((id) => {
                let p = players[id];
                if (!p.isAlive) return;

                if (p.selectedAction === 'scavenge') {
                    const zone = ZONES[p.location];
                    const foundItem = zone.specialItem;
                    p.inventory = p.inventory || { materials: {}, items: {} };
                    p.inventory.items = p.inventory.items || {};
                    p.inventory.items[foundItem] = (p.inventory.items[foundItem] || 0) + 1;
                    logs.push(`🔍 [${p.name}]이(가) ${zone.name}에서 [${foundItem}]을(를) 탐색해 획득했습니다.`);
                } else if (p.selectedAction === 'rest') {
                    const healAmt = 25;
                    p.hp = Math.min(p.maxHp, p.hp + healAmt);
                    logs.push(`💚 [${p.name}]이(가) 휴식을 취해 HP를 ${healAmt} 회복했습니다.`);
                } else if (p.selectedAction === 'attack') {
                    const enemies = Object.values(players).filter(e => e.isAlive && e.id !== p.id && e.location === p.location);
                    if (enemies.length > 0) {
                        const target = enemies[Math.floor(Math.random() * enemies.length)];
                        const weaponStat = ITEMS_DATABASE[p.equippedWeapon]?.atk || 5;
                        const strBonus = Math.floor((p.stats?.str || 10) / 2);
                        const dmg = weaponStat + strBonus;
                        
                        target.hp -= dmg;
                        logs.push(`⚔️ [${p.name}]이(가) [${target.name}]을(를) 공격하여 ${dmg} 데미지를 입혔습니다!`);

                        if (target.hp <= 0) {
                            target.hp = 0;
                            target.isAlive = false;
                            logs.push(`💀 [${target.name}]이(가) 치명상을 입고 탈락했습니다!`);
                        }
                    } else {
                        logs.push(`⚔️ [${p.name}]이(가) 공격을 시도했지만 같은 구역에 적이 없었습니다.`);
                    }
                }

                p.selectedAction = null;
            });

            if (currentTurn % 2 === 0 && restrictedZones.length < ZONES.length - 1) {
                let available = ZONES.map(z => z.id).filter(id => !restrictedZones.includes(id));
                if (available.length > 0) {
                    let newlyRestricted = available[Math.floor(Math.random() * available.length)];
                    restrictedZones.push(newlyRestricted);
                    logs.push(`🚨 [경고] ${ZONES[newlyRestricted].name} 구역이 금지 구역으로 지정되었습니다!`);

                    Object.keys(players).forEach((id) => {
                        let p = players[id];
                        if (p.isAlive && p.location === newlyRestricted) {
                            p.hp -= 40;
                            logs.push(`⚠️ [${p.name}]이(가) 금지 구역에 잔류하여 40 데미지를 입었습니다!`);
                            if (p.hp <= 0) {
                                p.hp = 0;
                                p.isAlive = false;
                                logs.push(`💀 [${p.name}]이(가) 금지 구역 자기장에 사살되었습니다!`);
                            }
                        }
                    });
                }
            }

            const roomRef = getRoomRef();
            await update(roomRef, {
                players: players,
                logs: logs,
                turn: currentTurn + 1,
                restrictedZones: restrictedZones
            });
        }

        function renderLogs(logs) {
            const container = document.getElementById("event-log-container");
            container.innerHTML = "";
            logs.slice(-30).forEach(log => {
                const item = document.createElement("div");
                item.className = "py-0.5 border-b border-slate-800/40";
                item.textContent = log;
                container.appendChild(item);
            });
            container.scrollTop = container.scrollHeight;
        }

        window.openInventoryModal = function() {
            document.getElementById("modal-inventory").classList.remove("hidden");
            renderInventory();
        };

        function renderInventory() {
            const equippedList = document.getElementById("inventory-equipped-list");
            const itemsList = document.getElementById("inventory-items-list");

            equippedList.innerHTML = `
                <div class="bg-slate-950 p-2 rounded border border-slate-800 text-xs flex justify-between">
                    <span class="text-slate-400">무기:</span>
                    <span class="font-bold text-amber-400">${player.equippedWeapon || "없음"}</span>
                </div>
                <div class="bg-slate-950 p-2 rounded border border-slate-800 text-xs flex justify-between">
                    <span class="text-slate-400">방어구:</span>
                    <span class="font-bold text-cyan-400">${player.equippedArmor || "없음"}</span>
                </div>
            `;

            itemsList.innerHTML = "";
            const items = player.inventory?.items || {};
            const itemKeys = Object.keys(items);

            if (itemKeys.length === 0) {
                itemsList.innerHTML = `<div class="text-xs text-slate-500 italic">소지 중인 아이템이 없습니다.</div>`;
                return;
            }

            itemKeys.forEach(itemName => {
                const count = items[itemName];
                if (count <= 0) return;

                const itemData = ITEMS_DATABASE[itemName] || {};
                const div = document.createElement("div");
                div.className = "bg-slate-950 p-2 rounded border border-slate-800 flex justify-between items-center text-xs";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-200">${itemName}</span>
                        <span class="text-slate-500 ml-1">x${count}</span>
                        <p class="text-[10px] text-slate-400">${itemData.desc || ""}</p>
                    </div>
                    <button onclick="useOrEquipItem('${itemName}')" class="bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded text-[10px] font-bold text-cyan-400 transition">
                        ${itemData.type === 'consumable' ? '사용' : '장착'}
                    </button>
                `;
                itemsList.appendChild(div);
            });
        }

        window.useOrEquipItem = async function(itemName) {
            const itemData = ITEMS_DATABASE[itemName];
            if (!itemData) return;

            if (itemData.type === 'weapon') {
                player.equippedWeapon = itemName;
            } else if (itemData.type === 'armor') {
                player.equippedArmor = itemName;
            } else if (itemData.type === 'consumable') {
                if (itemData.effect === 'heal') {
                    player.hp = Math.min(player.maxHp, player.hp + itemData.value);
                }
                player.inventory.items[itemName] -= 1;
            }

            const playerRef = ref(db, `rooms/${roomCode}/players/${localPlayerId}`);
            await update(playerRef, {
                hp: player.hp,
                equippedWeapon: player.equippedWeapon,
                equippedArmor: player.equippedArmor,
                inventory: player.inventory
            });

            renderInventory();
        };

        window.openCraftingModal = function() {
            document.getElementById("modal-crafting").classList.remove("hidden");
            renderCrafting();
        };

        function renderCrafting() {
            const summary = document.getElementById("crafting-materials-summary");
            const list = document.getElementById("crafting-recipes-list");

            const mats = player.inventory?.materials || {};
            summary.innerHTML = Object.keys(mats).map(m => 
                `<span class="bg-slate-950 border border-slate-800 px-2 py-0.5 rounded text-slate-300">${m}: ${mats[m]}</span>`
            ).join("") || `<span class="text-slate-500">보유 재료 없음</span>`;

            list.innerHTML = "";
            RECIPES.forEach(recipe => {
                const div = document.createElement("div");
                div.className = "bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs";
                
                let reqText = Object.keys(recipe.req).map(r => `${r} ${recipe.req[r]}개`).join(", ");

                div.innerHTML = `
                    <div>
                        <span class="font-bold text-amber-400">${recipe.name}</span>
                        <span class="text-[10px] text-slate-500 block">필요: ${reqText}</span>
                        <span class="text-[10px] text-slate-400 block">${recipe.desc}</span>
                    </div>
                    <button onclick="craftItem('${recipe.name}')" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg text-[10px] transition">
                        제작
                    </button>
                `;
                list.appendChild(div);
            });
        }

        window.craftItem = async function(recipeName) {
            const recipe = RECIPES.find(r => r.name === recipeName);
            if (!recipe) return;

            const mats = player.inventory?.materials || {};
            for (let reqMat in recipe.req) {
                if ((mats[reqMat] || 0) < recipe.req[reqMat]) {
                    alert(`재료가 부족합니다: ${reqMat}`);
                    return;
                }
            }

            for (let reqMat in recipe.req) {
                mats[reqMat] -= recipe.req[reqMat];
            }

            player.inventory.items = player.inventory.items || {};
            player.inventory.items[recipe.result] = (player.inventory.items[recipe.result] || 0) + 1;

            const playerRef = ref(db, `rooms/${roomCode}/players/${localPlayerId}`);
            await update(playerRef, {
                inventory: player.inventory
            });

            renderCrafting();
        };

        window.closeModal = function(id) {
            document.getElementById(id).classList.add("hidden");
        };

        // 앱 시작 실행
        initGame();
    </script>
</body>
</html>
